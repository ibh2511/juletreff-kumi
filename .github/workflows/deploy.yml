# Publiserer siden automatisk til GitHub Pages (gh-pages-grenen) hver gang main endres.
name: Publiser siden

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publiser
  cancel-in-progress: true

jobs:
  publiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publiser dist til gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist -b gh-pages --dotfiles -m "Publiser fra main ${GITHUB_SHA::7}" \
            -r "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
